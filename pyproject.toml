[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-resume-skill"
version = "0.1.0"
description = "DeepSeek-powered MCP skill for truthful JD-tailored resumes and cover letters"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["resume", "cover letter", "ATS", "MCP", "DeepSeek"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: AsyncIO",
  "Topic :: Text Processing",
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "httpx>=0.27.0,<1.0.0",
  "jinja2>=3.1.4",
  "lxml>=5.3.0",
  "mcp[cli]>=2.0.0,<3.0.0",
  "openai>=1.60.0",
  "Pillow>=10.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pypdf>=5.1.0",
  "python-docx>=1.1.0",
  "python-dotenv>=1.0.0",
]

[project.urls]
Repository = "https://github.com/justlikethis1/CareerResumeSkill"

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[project.scripts]
career-resume-skill = "career_resume_skill.server:main"
career-resume-generate = "career_resume_skill.cli:main"
career-resume-docx = "career_resume_skill.docx_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/career_resume_skill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
